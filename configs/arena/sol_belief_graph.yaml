# AvalonBot ablation, condition: belief_graph. Every seat on gpt-6.1-sol via an OpenAI-compatible endpoint
# (OPENAI_BASE_URL / OPENAI_API_KEY from .env). The good team plays belief_graph; evil always plays chat_only.
# Same base_seed in every condition, so game i has the same deal in each: one pair per game index.
#   python -m arena check --config configs/arena/sol_belief_graph.yaml
#   python -m arena run   --config configs/arena/sol_belief_graph.yaml --run-dir runs/sol/belief_graph

seats:
  - {provider: openai, model: gpt-6.1-sol}
  - {provider: openai, model: gpt-6.1-sol}
  - {provider: openai, model: gpt-6.1-sol}
  - {provider: openai, model: gpt-6.1-sol}
  - {provider: openai, model: gpt-6.1-sol}
roles: [Merlin, Servant, Servant, Assassin, Minion]
condition: belief_graph

num_games: 40         # pairs per condition; see README "Batch runs" for how this was chosen
base_seed: 0
shuffle_roles: true
shuffle_seats: false  # every seat plays the same model
random_leader: true

concurrency: 8        # games in parallel
max_game_retries: 0   # metered key: don't replay a failed game (re-run resumes it instead)
llm_timeout_s: 180
