# AvalonBot ablation, condition: rule_graph with a covered Merlin (merlin_strategy: cover). Every seat on gpt-6.1-sol via an OpenAI-compatible endpoint
# (OPENAI_BASE_URL / OPENAI_API_KEY from .env). The good team plays rule_graph; evil always plays chat_only.
# Same base_seed in every condition, so game i has the same deal in each: one pair per game index.
#   python -m arena check --config configs/arena/sol_rule_graph_cover.yaml
#   python -m arena run   --config configs/arena/sol_rule_graph_cover.yaml --run-dir runs/sol/rule_graph_cover

seats:
  - {provider: openai, model: gpt-6.1-sol}
  - {provider: openai, model: gpt-6.1-sol}
  - {provider: openai, model: gpt-6.1-sol}
  - {provider: openai, model: gpt-6.1-sol}
  - {provider: openai, model: gpt-6.1-sol}
roles: [Merlin, Servant, Servant, Assassin, Minion]
condition: rule_graph
merlin_strategy: cover  # Merlin votes and picks teams from public evidence; real knowledge only at match point

num_games: 12         # seeds 0-11, paired with the sol C batch; 8 games of credits stay reserved for the demo
base_seed: 0
shuffle_roles: true
shuffle_seats: false  # every seat plays the same model
random_leader: true

concurrency: 8        # games in parallel
max_inflight_requests: 6  # Boson's gateway rejects >~6-12 concurrent requests per key (429)
max_game_retries: 0   # metered key: don't replay a failed game (re-run resumes it instead)
llm_timeout_s: 180
